<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="/Logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Beaba.ia · O be-a-bá do câncer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    background: #d6eef3;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    color: #2d3748;
  }
  button, input, textarea { font: inherit; }

  /* PALCO: urso grande · chat · etiquetas (só no modo teste) */
  .palco { display: flex; align-items: flex-end; justify-content: center; gap: 28px; width: 100%; max-width: 1180px; }
  #urso-grande { width: 300px; flex-shrink: 0; padding-bottom: 12px; display: none; }
  #urso-grande svg, #urso-pequeno svg, #urso-pequeno img { display: block; width: 100%; height: auto; }

  .app-box {
    width: 100%;
    max-width: 540px;
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.13);
    display: flex;
    flex-direction: column;
    height: 88vh;
    height: 88dvh;
    max-height: 820px;
  }

  header { background: #3bbfce; padding: 12px 20px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  #urso-pequeno { width: 78px; flex-shrink: 0; margin: -2px 0 -6px; }
  header .title { color: #fff; }
  header .title h1 { font-size: 1.2rem; font-weight: 700; line-height: 1.2; }
  header .title p { font-size: 0.94rem; opacity: 0.9; }

  .container { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

  #messages { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .msg { display: flex; gap: 8px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .bubble { max-width: 86%; padding: 11px 14px; border-radius: 16px; font-size: 0.95rem; line-height: 1.55; }
  .msg.bot .bubble { background: #eaf5f7; border-radius: 4px 16px 16px 16px; }
  .msg.user .bubble { background: #3bbfce; color: #fff; border-radius: 16px 4px 16px 16px; }
  .bubble strong { font-weight: 700; }
  .bubble a { color: inherit; }
  .bubble .source { font-size: 0.72rem; color: #8a9bb0; margin-top: 8px; line-height: 1.5; border-top: 1px solid #d5e8ec; padding-top: 7px; }
  .bubble .status { color: #7a8fa0; font-size: 0.82rem; }

  /* CHIPS DE ABERTURA */
  #suggestions { padding: 2px 16px 10px; display: flex; flex-direction: column; gap: 9px; }
  #suggestions p { font-size: 0.8rem; color: #7a8fa0; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { background: #fff; border: 1.5px solid #3bbfce; border-radius: 20px; padding: 6px 13px; font-size: 0.82rem; color: #2a9aa8; cursor: pointer; transition: background .15s; font-weight: 600; }
  .chip:hover { background: #e8f6f8; }
  .chip.forte { background: #3bbfce; color: #fff; }
  .chip.forte:hover { background: #2da8b8; }

  .typing { display: flex; gap: 5px; padding: 8px 12px; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3bbfce; animation: bounce .8s infinite; }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

  .input-area { background: #fff; border-top: 1px solid #e0eef2; padding: 12px 16px; display: flex; gap: 8px; flex-shrink: 0; }
  #userInput { flex: 1; min-width: 0; border: 1.5px solid #c8e6eb; border-radius: 22px; padding: 10px 16px; font-size: 1rem; outline: none; transition: border-color .15s; background: #f7fbfc; }
  #userInput:focus { border-color: #3bbfce; background: #fff; }
  #sendBtn { background: #3bbfce; border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0; }
  #sendBtn:hover { background: #2da8b8; }
  #sendBtn svg { color: #fff; }

  /* AVALIAÇÃO DE CADA RESPOSTA */
  .feedback { margin: -4px 0 2px; display: flex; flex-direction: column; gap: 8px; max-width: 86%; }
  .feedback-row { display: flex; gap: 6px; }
  .feedback-row button { background: #fff; border: 1px solid #d5e3e8; border-radius: 12px; width: 34px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #7a8fa0; transition: all .15s; }
  .feedback-row button:hover { border-color: #3bbfce; color: #2a9aa8; }
  .feedback-row button.marcado { background: #3bbfce; border-color: #3bbfce; color: #fff; }
  .feedback-row svg { width: 15px; height: 15px; fill: currentColor; }
  .comentario { background: #fff; border: 1.5px solid #c8e6eb; border-radius: 14px; padding: 8px; display: flex; gap: 8px; align-items: flex-end; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
  .comentario textarea { flex: 1; border: none; outline: none; resize: none; font-size: 0.9rem; line-height: 1.4; min-height: 54px; background: transparent; color: inherit; }
  .comentario button { background: #3bbfce; color: #fff; border: none; border-radius: 16px; padding: 7px 14px; font-weight: 700; font-size: 0.82rem; cursor: pointer; }
  .comentario-ok { font-size: 0.78rem; color: #2a9aa8; font-weight: 600; }

  .cartao { margin: 0 0 4px; max-width: 86%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #f2a9b8; background: #fff5f7; font-size: 0.9rem; line-height: 1.45; display: flex; flex-direction: column; gap: 4px; }
  .cartao-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .cartao-acoes a { background: #e0526f; color: #fff; text-decoration: none; font-weight: 700; padding: 8px 14px; border-radius: 20px; }

  .disclaimer { font-size: 0.7rem; color: #8a9bab; text-align: center; padding: 6px 16px 8px; }

  /* ETIQUETAS (modo teste) */
  #etiquetas { display: none; }
  #etiquetas h2 { font-size: 0.78rem; font-weight: 700; color: #2a9aa8; text-transform: uppercase; letter-spacing: 0.6px; }
  #etiquetas dl { display: grid; gap: 10px; }
  #etiquetas dt { font-size: 0.72rem; color: #7a8fa0; font-weight: 600; }
  #etiquetas dd { font-size: 0.86rem; font-weight: 700; }
  #etiquetas dd.vazio { color: #b6c4cf; font-weight: 500; }
  body.teste #etiquetas { display: flex; flex-direction: column; gap: 14px; background: #fff; border-radius: 20px; padding: 18px; width: 220px; flex-shrink: 0; align-self: center; box-shadow: 0 8px 32px rgba(0,0,0,0.08); }

  @media (min-width: 900px) {
    #urso-grande { display: block; }
    #urso-pequeno { display: none; }
  }
  @media (max-width: 1130px) {
    body.teste #etiquetas { display: none; }
    body.teste .etiquetas-linha { display: flex; }
  }
  .etiquetas-linha { display: none; gap: 6px; padding: 8px 16px; overflow-x: auto; border-bottom: 1px solid #e0eef2; flex-shrink: 0; }
  .etiquetas-linha span { white-space: nowrap; font-size: 0.72rem; font-weight: 700; color: #2a9aa8; background: #e8f6f8; border-radius: 10px; padding: 3px 9px; }
  @media (max-width: 560px) {
    body { padding: 0; align-items: stretch; }
    .app-box { height: 100vh; height: 100dvh; max-height: none; border-radius: 0; }
  }
</style>
</head>
<body>
<div class="palco">
  <div id="urso-grande"></div>

  <div class="app-box">
    <header>
      <div id="urso-pequeno"><img src="Logo.svg" width="78" height="78" alt="Beaba"></div>
      <div class="title">
        <h1>Beaba.ia</h1>
        <p>O be-a-bá do câncer com inteligência artificial.</p>
      </div>
    </header>

    <div class="container">
      <div class="etiquetas-linha" id="etiquetas-linha"></div>
      <div id="messages"></div>
      <div id="suggestions">
        <div class="chips" id="chips-quem"></div>
        <p>Perguntas frequentes</p>
        <div class="chips" id="chips-perguntas"></div>
      </div>
      <div class="disclaimer">Sou uma inteligência artificial. As informações aqui são educativas e não substituem a consulta médica. As conversas são registradas sem identificação para melhorar o Beaba.</div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Qual é a sua dúvida?" autocomplete="off" />
      <button id="sendBtn" aria-label="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <aside id="etiquetas">
    <h2>Etiquetas</h2>
    <dl id="etiquetas-lista"></dl>
  </aside>
</div>

<script src="mascote.js"></script>
<script>
// ─── ABERTURA ────────────────────────────────────────────────────────────────
const QUEM = ['Sou paciente', 'Sou familiar ou cuido de alguém', 'Só quero entender melhor'];
const PERGUNTAS = ['O que é câncer?', 'Quais são os tipos de tratamento?', 'Como enfrentar o medo?', 'Onde tratar pelo SUS?'];

const CARTOES = {
  crise: {
    titulo: 'Você não precisa passar por isso sozinho',
    texto: 'O CVV conversa com você agora, de graça, 24 horas por dia.',
    acoes: [['Ligar 188', 'tel:188'], ['Chat do CVV', 'https://cvv.org.br/chat/']]
  },
  emergencia: {
    titulo: 'Isso pede atendimento agora',
    texto: 'Vá ao pronto-socorro ou ligue para o SAMU. Avise que a pessoa está em tratamento de câncer.',
    acoes: [['Ligar 192', 'tel:192']]
  }
};

const ROTULOS = { tipo_cancer: 'Tipo de câncer', tipo_duvida: 'Tipo de dúvida', quem: 'Quem fala', sentimento: 'Sentimento', reacao: 'Reação do urso' };
const ICONES = {
  up: '<svg viewBox="0 0 24 24"><path d="M2 10h4v11H2zM8 21h9.3a2.5 2.5 0 0 0 2.4-1.9l1.7-6.6A2.5 2.5 0 0 0 19 9.4h-5l.7-3.9A2.3 2.3 0 0 0 12.4 3L8 9.6z"/></svg>',
  down: '<svg viewBox="0 0 24 24" style="transform:scaleY(-1)"><path d="M2 10h4v11H2zM8 21h9.3a2.5 2.5 0 0 0 2.4-1.9l1.7-6.6A2.5 2.5 0 0 0 19 9.4h-5l.7-3.9A2.3 2.3 0 0 0 12.4 3L8 9.6z"/></svg>',
  comentar: '<svg viewBox="0 0 24 24"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 5v2h10V8zm0 4v2h7v-2z"/></svg>'
};

// ─── URSO ────────────────────────────────────────────────────────────────────
let urso = { reagir: function() {} }; // vira o mascote de verdade quando mascote.svg carrega
let sono;
function acordar() {
  clearTimeout(sono);
  sono = setTimeout(function() { if (!enviando) urso.reagir('dormindo', 0); }, 90000);
}

// ─── MENSAGENS ───────────────────────────────────────────────────────────────
const msgs = document.getElementById('messages');
const historico = [];
const sessao = Math.random().toString(36).slice(2) + Date.now().toString(36);
let enviando = false;

function escapar(t) {
  return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatar(texto) {
  return escapar(texto)
    .replace(/^#+\s*(.+)$/gm, '<strong>$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^[-•]\s+/gm, '• ')
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .split('\n').join('<br>');
}

function addMessage(html, isUser) {
  const div = document.createElement('div');
  div.className = 'msg ' + (isUser ? 'user' : 'bot');
  div.innerHTML = '<div class="bubble">' + html + '</div>';
  msgs.appendChild(div);
  if (isUser) msgs.scrollTop = msgs.scrollHeight;
  else setTimeout(function() { div.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
  return div.querySelector('.bubble');
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  div.innerHTML = '<div class="bubble"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function htmlFontes(fontes) {
  if (!fontes.length) return '';
  const itens = fontes.map(function(f) {
    const data = f.atualizado ? ' · atualizado em ' + escapar(f.atualizado) : '';
    return '<a href="' + escapar(f.url) + '" target="_blank" rel="noopener">' + escapar(f.fonte) + ': ' + escapar(f.titulo) + '</a>' + data;
  });
  return '<div class="source">Fontes<br>' + itens.join('<br>') + '</div>';
}

function addCartao(tipo) {
  const c = CARTOES[tipo];
  if (!c) return;
  const div = document.createElement('div');
  div.className = 'cartao';
  div.innerHTML = '<strong>' + c.titulo + '</strong><span>' + c.texto + '</span><div class="cartao-acoes">' +
    c.acoes.map(function(a) { return '<a href="' + a[1] + '" target="_blank" rel="noopener">' + a[0] + '</a>'; }).join('') + '</div>';
  msgs.appendChild(div);
}

// ─── AVALIAÇÃO: 👍 👎 e comentário em cada resposta ───────────────────────────
function mandarFeedback(id, dados) {
  if (!id) return;
  fetch('/api/feedback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ id: id }, dados))
  }).catch(function() {});
}

function addFeedback(id) {
  const caixa = document.createElement('div');
  caixa.className = 'feedback';
  const linha = document.createElement('div');
  linha.className = 'feedback-row';
  caixa.appendChild(linha);

  function abrirComentario() {
    if (caixa.querySelector('.comentario')) { caixa.querySelector('textarea').focus(); return; }
    const antigo = caixa.querySelector('.comentario-ok');
    if (antigo) antigo.remove();
    const pop = document.createElement('div');
    pop.className = 'comentario';
    pop.innerHTML = '<textarea placeholder="O que você achou desta resposta?"></textarea><button>Enviar</button>';
    pop.querySelector('button').addEventListener('click', function() {
      const texto = pop.querySelector('textarea').value.trim();
      if (texto) {
        mandarFeedback(id, { comentario: texto });
        urso.reagir('concordando');
      }
      pop.outerHTML = texto ? '<div class="comentario-ok">Comentário enviado</div>' : '';
    });
    caixa.appendChild(pop);
    pop.querySelector('textarea').focus();
    pop.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  [['up', 'Ajudou'], ['down', 'Não ajudou'], ['comentar', 'Comentar']].forEach(function(item) {
    const btn = document.createElement('button');
    btn.innerHTML = ICONES[item[0]];
    btn.title = item[1];
    btn.setAttribute('aria-label', item[1]);
    btn.addEventListener('click', function() {
      if (item[0] !== 'comentar') {
        linha.querySelectorAll('button').forEach(function(b) { b.classList.remove('marcado'); });
        btn.classList.add('marcado');
        mandarFeedback(id, { voto: item[0] });
        urso.reagir(item[0] === 'up' ? 'feliz' : 'ouvindo', item[0] === 'up' ? undefined : 2500);
      }
      abrirComentario();
    });
    linha.appendChild(btn);
  });
  msgs.appendChild(caixa);
}

// ─── ETIQUETAS (modo teste) ──────────────────────────────────────────────────
function mostrarEtiquetas(etiquetas, reacao) {
  document.body.classList.add('teste');
  const tudo = Object.assign({}, etiquetas, { reacao: reacao });
  const legivel = function(v) { return v ? v.replace(/_/g, ' ') : ''; };
  document.getElementById('etiquetas-lista').innerHTML = Object.keys(ROTULOS).map(function(k) {
    return '<div><dt>' + ROTULOS[k] + '</dt><dd' + (tudo[k] ? '' : ' class="vazio"') + '>' + (legivel(tudo[k]) || '—') + '</dd></div>';
  }).join('');
  document.getElementById('etiquetas-linha').innerHTML = Object.keys(ROTULOS).filter(function(k) { return tudo[k]; })
    .map(function(k) { return '<span>' + legivel(tudo[k]) + '</span>'; }).join('');
}

// ─── CONVERSA ────────────────────────────────────────────────────────────────
async function sendMessage(text) {
  const input = text || document.getElementById('userInput').value.trim();
  if (!input || enviando) return;
  enviando = true;
  document.getElementById('userInput').value = '';
  document.getElementById('suggestions').style.display = 'none';

  addMessage(escapar(input), true);
  showTyping();
  urso.reagir('pensando');

  let bolha = null;
  let resposta = '';
  let fim = null;
  let erro = '';

  function tratar(ev) {
    if (ev.status && !bolha) {
      const t = document.querySelector('#typing .bubble');
      if (t) t.innerHTML = '<span class="status">' + escapar(ev.status) + '…</span>';
      urso.reagir('lendo');
    }
    if (ev.limpar) resposta = '';
    if (ev.t) resposta += ev.t;
    if (ev.t || ev.limpar) {
      if (!bolha) { removeTyping(); bolha = addMessage('', false); urso.reagir('falando'); }
      bolha.innerHTML = formatar(resposta);
    }
    if (ev.fim) fim = ev;
    if (ev.erro) erro = ev.erro;
  }

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: input, historico: historico, sessao: sessao })
    });
    if (!response.ok) {
      const data = await response.json().catch(function() { return {}; });
      erro = response.status === 429 && data.error ? data.error : 'Ops, tive um problema técnico. Tente novamente!';
    } else {
      const leitor = response.body.getReader();
      const dec = new TextDecoder();
      let resto = '';
      for (;;) {
        const parte = await leitor.read();
        if (parte.done) break;
        resto += dec.decode(parte.value, { stream: true });
        const linhas = resto.split('\n');
        resto = linhas.pop();
        linhas.filter(Boolean).forEach(function(l) { tratar(JSON.parse(l)); });
      }
    }
  } catch (err) {
    erro = erro || 'Ops, não consegui me conectar agora. Tente novamente!';
  }

  removeTyping();
  if (resposta && fim) {
    bolha.innerHTML = formatar(resposta) + htmlFontes(fim.fontes || []);
    const cartoes = fim.cartoes || [];
    cartoes.forEach(addCartao);
    historico.push({ role: 'user', content: input }, { role: 'assistant', content: resposta });
    addFeedback(fim.id);
    const reacao = cartoes.indexOf('emergencia') >= 0 ? 'alerta' : cartoes.indexOf('crise') >= 0 ? 'acolhendo' : (fim.reacao || 'parado');
    const fica = { alerta: 9000, acolhendo: 10000, triste: 9000, respirando: 24000 };
    urso.reagir(reacao, fica[reacao]);
    if (fim.etiquetas) mostrarEtiquetas(fim.etiquetas, reacao === 'parado' ? '' : reacao);
  } else {
    if (bolha) bolha.closest('.msg').remove();
    addMessage(escapar(erro || 'Ops, tive um problema técnico. Tente novamente!'), false);
    urso.reagir('surpreso');
  }
  enviando = false;
  acordar();
}

// ─── INÍCIO ──────────────────────────────────────────────────────────────────
function chips(id, lista, forte) {
  const el = document.getElementById(id);
  lista.forEach(function(texto) {
    const btn = document.createElement('button');
    btn.className = 'chip' + (forte ? ' forte' : '');
    btn.textContent = texto;
    btn.addEventListener('click', function() { sendMessage(texto); });
    el.appendChild(btn);
  });
}
chips('chips-quem', QUEM, true);
chips('chips-perguntas', PERGUNTAS, false);

document.getElementById('sendBtn').addEventListener('click', function() { sendMessage(); });
document.getElementById('userInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') sendMessage(); });
document.getElementById('userInput').addEventListener('input', function(e) {
  if (!enviando) urso.reagir(e.target.value ? 'ouvindo' : 'parado');
  acordar();
});

addMessage('Oi! Eu sou o <strong>Beaba</strong>, uma inteligência artificial do Instituto Beaba. Estou aqui para conversar sobre câncer com calma e com informação confiável.<br><br>Para eu te ajudar melhor: quem é você nessa história?', false);

// O urso mora ao lado do chat nas telas largas e no cabeçalho no celular.
const telaLarga = window.matchMedia('(min-width: 900px)');
const casaDoUrso = function() { return document.getElementById(telaLarga.matches ? 'urso-grande' : 'urso-pequeno'); };
Mascote.criar(casaDoUrso()).then(function(m) {
  urso = m;
  urso.seguirPonteiro();
  urso.reagir('acenando');
  acordar();
  telaLarga.addEventListener('change', function() { const casa = casaDoUrso(); casa.innerHTML = ''; casa.appendChild(urso.svg); });
}).catch(function() {});
</script>
</body>
</html>
