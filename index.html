<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Beaba.ai — Informações sobre Câncer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    background: #d6eef3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  /* BOX WRAPPER */
  .app-box {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.13);
    display: flex;
    flex-direction: column;
    height: 88vh;
    max-height: 800px;
  }

  /* HEADER */
  header {
    background: #3bbfce;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #urso { width: 58px; flex-shrink: 0; margin: -6px 0 -8px; }
  #urso svg, #urso img { display: block; width: 100%; height: auto; }
  header .title { color: #fff; }
  header .title h1 { font-size: 1.2rem; font-weight: 700; line-height: 1.2; }
  header .title p { font-size: 0.94rem; opacity: 0.9; }

  /* MAIN LAYOUT */
  .container {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  /* CANCER TYPE FILTERS */
  .filters {
    padding: 12px 16px 8px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: #fff;
    border: 1.5px solid #3bbfce;
    color: #3bbfce;
    border-radius: 20px;
    padding: 5px 13px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all .15s;
    font-weight: 500;
  }
  .filter-btn:hover, .filter-btn.active {
    background: #3bbfce;
    color: #fff;
  }

  /* MESSAGES */
  #messages {
    flex: 1;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }

  .msg { display: flex; gap: 8px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--avatar-color, #3bbfce); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .msg.user .avatar { background: #e8f6f8; }

  .bubble {
    max-width: 82%;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 0.92rem;
    line-height: 1.55;
    color: #2d3748;
  }
  .msg.bot .bubble {
    background: #eaf5f7;
    border-radius: 4px 16px 16px 16px;
    box-shadow: none;
  }
  .msg.user .bubble {
    background: #3bbfce;
    color: #fff;
    border-radius: 16px 4px 16px 16px;
  }

  .bubble .cancer-tag {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .bubble img { width: 100%; max-width: 220px; display: block; margin: 10px auto 4px; border-radius: 12px; }
  .bubble .source { font-size: 0.72rem; color: #8a9bb0; margin-top: 8px; font-style: italic; }
  .bubble strong { font-weight: 700; }
  .bubble a { color: inherit; }
  .bubble .source { font-style: normal; line-height: 1.5; border-top: 1px solid #d5e8ec; padding-top: 7px; }
  .bubble .status { color: #7a8fa0; font-size: 0.82rem; }
  .cartao {
    margin: 4px 0 12px 42px;
    max-width: 82%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid #f2a9b8;
    background: #fff5f7;
    color: #2d3748;
    font-size: 0.88rem;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cartao-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .cartao-acoes a {
    background: #e0526f;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 20px;
  }

  /* SUGGESTIONS */
  #suggestions {
    padding: 8px 16px 4px;
  }
  #suggestions p {
    font-size: 0.8rem;
    color: #7a8fa0;
    margin-bottom: 9px;
    font-weight: 500;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    max-height: 72px;
    overflow: hidden;
  }
  .chip {
    background: #fff;
    border: 1.5px solid #3bbfce;
    border-radius: 20px;
    padding: 5px 13px;
    font-size: 0.78rem;
    color: #3bbfce;
    cursor: pointer;
    transition: all .15s;
    font-weight: 500;
  }
  .chip:hover { background: #e8f6f8; }

  /* TYPING */
  .typing { display: flex; gap: 5px; padding: 8px 12px; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3bbfce; animation: bounce .8s infinite; }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

  /* INPUT */
  .input-area {
    background: #fff;
    border-top: 1px solid #e0eef2;
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  #userInput {
    flex: 1;
    border: 1.5px solid #c8e6eb;
    border-radius: 22px;
    padding: 10px 16px;
    font-size: 0.9rem;
    outline: none;
    transition: border-color .15s;
    background: #f7fbfc;
  }
  #userInput:focus { border-color: #3bbfce; background: #fff; }
  #sendBtn {
    background: #3bbfce;
    border: none;
    border-radius: 50%;
    width: 42px; height: 42px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
    flex-shrink: 0;
  }
  #sendBtn:hover { background: #2da8b8; }
  #sendBtn svg { color: #fff; }

  /* FEEDBACK */
  .feedback-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0 4px 40px;
    font-size: 0.75rem;
    color: #9ab;
  }
  .feedback-row button {
    background: none;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 2px 8px;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all .15s;
    width: auto;
    height: auto;
    border-radius: 12px;
  }
  .feedback-row button:hover { background: #f0f8fa; border-color: #3bbfce; }

  /* DISCLAIMER */
  .disclaimer {
    font-size: 0.7rem;
    color: #9ab;
    text-align: center;
    padding: 4px 16px 10px;
  }
</style>
</head>
<body>
<div class="app-box">

<header>
  <div id="urso"><img src="Logo.svg" width="48" height="48" alt="Beaba"></div>
  <div class="title">
    <h1>Beaba.ia</h1>
    <p>O be-a-bá do câncer com inteligência artificial.</p>
  </div>
</header>

<div class="container">

  <!-- FILTER BUTTONS -->
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="todos" data-color="#3bbfce">todos</button>
    <button class="filter-btn" data-filter="infantil" data-color="#3bbfce">infantojuvenil</button>
    <button class="filter-btn" data-filter="mama" data-color="rgb(255 143 178)" style="border-color:rgb(255 143 178);color:rgb(255 143 178);">mama</button>
    <button class="filter-btn" data-filter="prostata" data-color="rgb(120 193 233)" style="border-color:rgb(120 193 233);color:rgb(120 193 233);">próstata</button>
    <button class="filter-btn" data-filter="leucemia" data-color="rgb(255 180 71)" style="border-color:rgb(255 180 71);color:rgb(255 180 71);">leucemia</button>
    <button class="filter-btn" data-filter="intestino" data-color="rgb(74 123 191)" style="border-color:rgb(74 123 191);color:rgb(74 123 191);">intestino</button>
    <button class="filter-btn" data-filter="pulmao" data-color="rgb(166 161 161)" style="border-color:rgb(166 161 161);color:rgb(166 161 161);">pulmão</button>
    <button class="filter-btn" data-filter="utero" data-color="rgb(187 145 234)" style="border-color:rgb(187 145 234);color:rgb(187 145 234);">útero</button>
  </div>

  <!-- MESSAGES -->
  <div id="messages"></div>

  <!-- SUGGESTIONS -->
  <div id="suggestions">
    <p>Perguntas frequentes:</p>
    <div class="chips" id="chips"></div>
  </div>

  <div class="disclaimer">
    Sou uma inteligência artificial. As informações aqui são educativas e não substituem a consulta médica. As conversas são registradas sem identificação para melhorar o Beaba.
  </div>
</div>

<!-- INPUT -->
<div class="input-area">
  <input type="text" id="userInput" placeholder="Qual é a sua dúvida?" autocomplete="off" />
  <button id="sendBtn" onclick="handleSend()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<script src="mascote.js"></script>
<script>
// ─── SUGGESTIONS POR TIPO ────────────────────────────────────────────────────
const suggestionsByType = {
  todos: [
    'O que é câncer?',
    'Quais são os tipos de tratamento?',
    'Como enfrentar o medo?',
    'Onde tratar pelo SUS?'
  ],
  infantil: [
    'O que é câncer infantojuvenil?',
    'Sinais de alerta em crianças',
    'Como é o tratamento para crianças?',
    'O que é transplante de medula?'
  ],
  mama: [
    'O que é câncer de mama?',
    'O que significa HER2 positivo?',
    'Tratamentos para câncer de mama',
    'Sintomas do câncer de mama'
  ],
  prostata: [
    'O que é câncer de próstata?',
    'Sintomas do câncer de próstata',
    'O que é o PSA?',
    'Tratamentos para próstata'
  ],
  leucemia: [
    'O que é leucemia?',
    'Tipos de leucemia',
    'Sintomas da leucemia',
    'Leucemia tem cura?',
    'O que é transplante de medula?'
  ],
  intestino: [
    'O que é câncer de intestino?',
    'Sangue nas fezes é sinal de câncer?',
    'Para que serve a colonoscopia?',
    'Sinais do câncer colorretal'
  ],
  pulmao: [
    'O que é câncer de pulmão?',
    'Sintomas do câncer de pulmão',
    'Tipos de câncer de pulmão',
    'Tratamento câncer de pulmão'
  ],
  utero: [
    'O que é câncer de colo do útero?',
    'Quando devo fazer Papanicolau?',
    'Vacina HPV protege do câncer?',
    'HPV sempre causa câncer?'
  ]
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentFilter = 'todos';

// ─── UTILS ───────────────────────────────────────────────────────────────────
function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = '#fff';
    b.style.color = b.dataset.color || '#3bbfce';
  });
  if (btn) {
    btn.classList.add('active');
    const color = btn.dataset.color || '#3bbfce';
    btn.style.background = color;
    btn.style.color = '#fff';
    document.documentElement.style.setProperty('--avatar-color', color);
  }
  renderSuggestions();
}

// Hover: show outline for colored buttons
document.querySelectorAll('.filter-btn').forEach(function(b) {
  const color = b.dataset.color || '#3bbfce';
  b.addEventListener('mouseenter', function() {
    if (!b.classList.contains('active')) {
      b.style.background = '#fff';
      b.style.color = color;
      b.style.opacity = '1';
    }
  });
  b.addEventListener('mouseleave', function() {
    if (!b.classList.contains('active')) applyButtonStyle(b, false);
  });
});

function getFilterColor() {
  const btn = document.querySelector(`.filter-btn[data-filter="${currentFilter}"]`);
  return btn ? (btn.dataset.color || '#3bbfce') : '#3bbfce';
}

function renderSuggestions() {
  const chips = document.getElementById('chips');
  const list = suggestionsByType[currentFilter] || suggestionsByType.todos;
  const color = getFilterColor();
  chips.innerHTML = '';
  list.forEach(function(s) {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = s;
    btn.style.borderColor = color;
    btn.style.color = color;
    btn.addEventListener('click', function() { sendMessage(s); });
    chips.appendChild(btn);
  });
}

function addMessage(text, isUser, tag, tagColor) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${isUser ? 'user' : 'bot'}`;

  let content = '';
  if (!isUser && tag) {
    content += `<span class="cancer-tag" style="background:${tagColor}20;color:${tagColor}">${tag}</span><br>`;
  }
  content += text;

  const color = getFilterColor();
  const userBubbleStyle = isUser ? `style="background:${color}"` : '';
  const avatarBg = isUser ? '#e8f6f8' : color;
  div.innerHTML = `
    <div class="avatar" style="background:${avatarBg}">${isUser ? '👤' : '🐻'}</div>
    <div class="bubble" ${userBubbleStyle}>${content}</div>
  `;
  msgs.appendChild(div);
  if (isUser) {
    msgs.scrollTop = msgs.scrollHeight;
  } else {
    setTimeout(function() { div.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
  }
  return div.querySelector('.bubble');
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  div.innerHTML = `
    <div class="avatar">🐻</div>
    <div class="bubble"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function addFeedbackButtons(pergunta, resposta) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'feedback-row';

  const label = document.createElement('span');
  label.textContent = 'Isso foi útil?';
  div.appendChild(label);

  const icons = [
    ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="15" height="15" style="display:inline-block;vertical-align:middle"><path d="M27.05,87.44c-.03,4.27-3.29,7.79-7.55,7.8l-8.38.03c-4.35.02-7.86-3.33-7.86-7.78v-41.38c0-4.43,3.55-7.74,7.85-7.74h8.07c3.67,0,6.64,2.28,7.71,5.99,2.77-1.34,5.07-3.02,7.16-5.3,6.22-6.78,10.93-14.92,13.19-23.91.68-2.71.49-5.46,1.29-8.04.9-2.9,3.21-4.79,6.33-4.39s6.05,1.95,7.89,4.63c5.5,8,5.69,18.3.86,26.86l25.53.07c3.73,0,6.8,2.93,7.78,5.92,1.27,3.87-.08,7.67-3.31,10.09,2.71,1.93,4.04,4.87,3.73,8.11-.27,2.87-2.01,5.6-4.99,7.04,2.3,2.01,3.3,4.82,2.87,7.93-.37,2.66-2.27,5.1-4.83,6.58,2.79,2.7,3.6,6.36,2.22,9.77-1.25,3.07-4.19,5.51-7.93,5.52l-37.54.07c-8.35.02-15.65-3.73-20.07-10.83l-.02,2.95ZM86.83,66.36l-8.58-.06c-.83,0-1.54-.67-1.63-1.44-.07-.59.69-1.64,1.41-1.64l10.55-.03c3.25,0,5.74-2.58,5.72-5.7-.01-2.81-2.28-5.61-5.4-5.63l-9.02-.05c-.59,0-1.39-1.15-1.31-1.69.09-.59.93-1.42,1.58-1.42l8.44.02c3.33,0,5.85-2.82,5.71-5.98s-2.78-5.43-6.07-5.42l-27.57.02c-.46,0-1.29-.62-1.44-1s0-1.14.32-1.59c5.46-7.41,5.95-17.19,1.14-25.02-2.13-3.46-6.88-4.82-8.23-3.48-.39.39-.92,1.38-1.02,2.06l-1.31,8.37c-2.96,10.5-9.86,22.32-18.73,28.74-1.32.95-2.79,1.54-4.34,2.12l.07,26.1c.03,9.92,8.28,18.43,18.29,18.44l39.19.07c3.33,0,5.59-2.74,5.57-5.76-.01-2.84-2.33-5.58-5.44-5.58l-8.42-.02c-.88,0-1.6-.71-1.66-1.45-.04-.51.7-1.61,1.28-1.61h10.08c3.33,0,6.07-2.09,6.23-5.53.13-2.75-2.06-5.81-5.41-5.83ZM19.63,92.14c2.16-.01,4.31-2.09,4.31-4.31v-41.71c.01-2.71-2.18-4.63-4.74-4.63h-8.09c-2.54,0-4.76,1.93-4.76,4.64l.02,41.69c0,2.61,2.52,4.4,4.8,4.38l8.46-.06Z" fill="currentColor"/></svg>', '👍'],
    ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="15" height="15" style="display:inline-block;vertical-align:middle;transform:scaleY(-1)"><path d="M27.05,87.44c-.03,4.27-3.29,7.79-7.55,7.8l-8.38.03c-4.35.02-7.86-3.33-7.86-7.78v-41.38c0-4.43,3.55-7.74,7.85-7.74h8.07c3.67,0,6.64,2.28,7.71,5.99,2.77-1.34,5.07-3.02,7.16-5.3,6.22-6.78,10.93-14.92,13.19-23.91.68-2.71.49-5.46,1.29-8.04.9-2.9,3.21-4.79,6.33-4.39s6.05,1.95,7.89,4.63c5.5,8,5.69,18.3.86,26.86l25.53.07c3.73,0,6.8,2.93,7.78,5.92,1.27,3.87-.08,7.67-3.31,10.09,2.71,1.93,4.04,4.87,3.73,8.11-.27,2.87-2.01,5.6-4.99,7.04,2.3,2.01,3.3,4.82,2.87,7.93-.37,2.66-2.27,5.1-4.83,6.58,2.79,2.7,3.6,6.36,2.22,9.77-1.25,3.07-4.19,5.51-7.93,5.52l-37.54.07c-8.35.02-15.65-3.73-20.07-10.83l-.02,2.95ZM86.83,66.36l-8.58-.06c-.83,0-1.54-.67-1.63-1.44-.07-.59.69-1.64,1.41-1.64l10.55-.03c3.25,0,5.74-2.58,5.72-5.7-.01-2.81-2.28-5.61-5.4-5.63l-9.02-.05c-.59,0-1.39-1.15-1.31-1.69.09-.59.93-1.42,1.58-1.42l8.44.02c3.33,0,5.85-2.82,5.71-5.98s-2.78-5.43-6.07-5.42l-27.57.02c-.46,0-1.29-.62-1.44-1s0-1.14.32-1.59c5.46-7.41,5.95-17.19,1.14-25.02-2.13-3.46-6.88-4.82-8.23-3.48-.39.39-.92,1.38-1.02,2.06l-1.31,8.37c-2.96,10.5-9.86,22.32-18.73,28.74-1.32.95-2.79,1.54-4.34,2.12l.07,26.1c.03,9.92,8.28,18.43,18.29,18.44l39.19.07c3.33,0,5.59-2.74,5.57-5.76-.01-2.84-2.33-5.58-5.44-5.58l-8.42-.02c-.88,0-1.6-.71-1.66-1.45-.04-.51.7-1.61,1.28-1.61h10.08c3.33,0,6.07-2.09,6.23-5.53.13-2.75-2.06-5.81-5.41-5.83ZM19.63,92.14c2.16-.01,4.31-2.09,4.31-4.31v-41.71c.01-2.71-2.18-4.63-4.74-4.63h-8.09c-2.54,0-4.76,1.93-4.76,4.64l.02,41.69c0,2.61,2.52,4.4,4.8,4.38l8.46-.06Z" fill="currentColor"/></svg>', '👎']
  ];

  icons.forEach(function(item) {
    const btn = document.createElement('button');
    btn.innerHTML = item[0];
    btn.title = item[1] === '👍' ? 'Sim, ajudou' : 'Não ajudou';
    btn.addEventListener('click', function() {
      sendFeedback(pergunta, resposta, item[1]);
      urso.reagir(item[1] === '👍' ? 'feliz' : 'ouvindo', item[1] === '👍' ? undefined : 2500);
      div.innerHTML = '<span style="color:#3bbfce;font-size:0.78rem">Obrigado pelo feedback! ' + item[1] + '</span>';
    });
    div.appendChild(btn);
  });

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}


const LOGGER_URL = 'https://script.google.com/macros/s/AKfycbx2BoTnDsfgbVJ8GxSVJKa9OY6h8qUo7B5nbK_OeZstAs9RGXEH1zyn6WdSGOdDJfQE/exec';

function sendFeedback(pergunta, resposta, feedback) {

    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ categoria: currentFilter, pergunta, resposta, feedback })
  });
}

// ─── CONVERSA ────────────────────────────────────────────────────────────────
let urso = { reagir: function() {} }; // vira o mascote de verdade quando mascote.svg carrega
const historico = [];
const sessao = Math.random().toString(36).slice(2) + Date.now().toString(36);
let enviando = false;

const CARTOES = {
  crise: {
    titulo: 'Você não precisa passar por isso sozinho',
    texto: 'O CVV conversa com você agora, de graça, 24 horas por dia.',
    acoes: [['Ligar 188', 'tel:188'], ['Chat do CVV', 'https://cvv.org.br/chat/']]
  },
  emergencia: {
    titulo: 'Isso pede atendimento agora',
    texto: 'Vá ao pronto-socorro ou ligue para o SAMU. Avise que a pessoa está em tratamento de câncer.',
    acoes: [['Ligar 192', 'tel:192']]
  }
};

function escapar(t) {
  return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatar(texto) {
  return escapar(texto)
    .replace(/^#+\s*(.+)$/gm, '<strong>$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^[-•]\s+/gm, '• ')
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .split('\n').join('<br>');
}

function htmlFontes(fontes) {
  if (!fontes.length) return '';
  const itens = fontes.map(function(f) {
    const data = f.atualizado ? ' · atualizado em ' + escapar(f.atualizado) : '';
    return '<a href="' + escapar(f.url) + '" target="_blank" rel="noopener">' + escapar(f.fonte) + ': ' + escapar(f.titulo) + '</a>' + data;
  });
  return '<div class="source">Fontes<br>' + itens.join('<br>') + '</div>';
}

function addCartao(tipo) {
  const c = CARTOES[tipo];
  if (!c) return;
  const div = document.createElement('div');
  div.className = 'cartao';
  div.innerHTML = '<strong>' + c.titulo + '</strong><span>' + c.texto + '</span><div class="cartao-acoes">' +
    c.acoes.map(function(a) { return '<a href="' + a[1] + '" target="_blank" rel="noopener">' + a[0] + '</a>'; }).join('') + '</div>';
  document.getElementById('messages').appendChild(div);
}

async function sendMessage(text) {
  const input = text || document.getElementById('userInput').value.trim();
  if (!input || enviando) return;
  enviando = true;
  document.getElementById('userInput').value = '';

  addMessage(input, true);
  showTyping();
  urso.reagir('pensando');

  let bolha = null;
  let resposta = '';
  let fim = null;
  let erro = '';

  function tratar(ev) {
    if (ev.status && !bolha) {
      const t = document.querySelector('#typing .bubble');
      if (t) t.innerHTML = '<span class="status">' + escapar(ev.status) + '…</span>';
      urso.reagir('lendo');
    }
    if (ev.limpar) resposta = '';
    if (ev.t) resposta += ev.t;
    if (ev.t || ev.limpar) {
      if (!bolha) { removeTyping(); bolha = addMessage('', false, null, getFilterColor()); urso.reagir('falando'); }
      bolha.innerHTML = formatar(resposta);
    }
    if (ev.fim) fim = ev;
    if (ev.erro) erro = ev.erro;
  }

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: input, categoria: currentFilter, historico: historico, sessao: sessao })
    });
    if (!response.ok) {
      const data = await response.json().catch(function() { return {}; });
      erro = response.status === 429 && data.error ? data.error : 'Ops, tive um problema técnico. Tente novamente!';
    } else {
      const leitor = response.body.getReader();
      const dec = new TextDecoder();
      let resto = '';
      for (;;) {
        const parte = await leitor.read();
        if (parte.done) break;
        resto += dec.decode(parte.value, { stream: true });
        const linhas = resto.split('\n');
        resto = linhas.pop();
        linhas.filter(Boolean).forEach(function(l) { tratar(JSON.parse(l)); });
      }
    }
  } catch (err) {
    erro = erro || 'Ops, não consegui me conectar agora. Tente novamente!';
  }

  removeTyping();
  if (resposta && fim) {
    bolha.innerHTML = formatar(resposta) + htmlFontes(fim.fontes || []);
    (fim.cartoes || []).forEach(addCartao);
    historico.push({ role: 'user', content: input }, { role: 'assistant', content: resposta });
    addFeedbackButtons(input, resposta);
    const cartoes = fim.cartoes || [];
    if (cartoes.indexOf('emergencia') >= 0) urso.reagir('alerta', 9000);
    else if (cartoes.indexOf('crise') >= 0) urso.reagir('acolhendo', 12000);
    else if (fim.reacao) urso.reagir(fim.reacao, fim.reacao === 'acolhendo' ? 9000 : undefined);
    else urso.reagir('parado');
  } else {
    if (bolha) bolha.closest('.msg').remove();
    addMessage(erro || 'Ops, tive um problema técnico. Tente novamente!', false, '🌟 Beaba', '#3bbfce');
    urso.reagir('surpreso');
  }
  enviando = false;
}

function handleSend() {
  sendMessage();
}

// Teclado
document.getElementById('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSend();
});
document.getElementById('userInput').addEventListener('input', e => {

});

  false, null, null
);
